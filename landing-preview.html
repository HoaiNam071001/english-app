<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev-preview-landing.tsx"></script>
    <script>
      window.addEventListener("load", () => {
        setTimeout(() => {
          const debug = document.createElement("pre");
          debug.id = "debug-info";
          debug.style.cssText =
            "position:fixed;top:0;left:0;z-index:99999;background:#fff;color:#000;font-size:10px;padding:8px;max-width:100vw;overflow:auto;";
          const h1 = document.querySelector("h1");
          const badge = document.querySelector("h1")?.previousElementSibling;
          const info = {
            bodyScrollWidth: document.body.scrollWidth,
            docScrollWidth: document.documentElement.scrollWidth,
            innerWidth: window.innerWidth,
            h1Rect: h1 ? h1.getBoundingClientRect() : null,
            h1ComputedFontSize: h1 ? getComputedStyle(h1).fontSize : null,
            h1ComputedTextAlign: h1 ? getComputedStyle(h1).textAlign : null,
            badgeRect: badge ? badge.getBoundingClientRect() : null,
          };
          debug.textContent = JSON.stringify(info, null, 2);
          document.body.appendChild(debug);
        }, 1500);
      });
    </script>
  </body>
</html>
